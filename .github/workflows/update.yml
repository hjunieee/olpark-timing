name: 예보 갱신과 배포
on:
  schedule:
    - cron: '7 21 * * *'      # 매일 06:07 KST: 예보 다시 계산 (정각은 GitHub 혼잡으로 누락이 잦아 피함)
    - cron: '17,47 * * * *'   # 30분마다: 실시간 주차 대수만 갱신
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: 예보 다시 계산, realtime: 실시간 대수만'
        default: full
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 예보 계산
        if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'realtime') || github.event.schedule == '7 21 * * *'
        env:
          CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
        run: |
          pip install -r requirements.txt
          python pipeline/build.py --source "${{ vars.SOURCE || 'api2025' }}"
      - name: 결과 커밋
        if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'realtime') || github.event.schedule == '7 21 * * *'
        run: |
          git config user.name "olpark-timing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data raw/events
          git diff --cached --quiet || git commit -m "예보 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
      - name: 실시간 주차 대수 (커밋하지 않고 배포물에만 넣는다)
        run: python pipeline/realtime.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
